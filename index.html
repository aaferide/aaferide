<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b6c">
<title>AI FERIDE</title>
<style>
:root{
  --bg:#f2f6f4; --surface:#ffffff; --ink:#14232b; --muted:#5d6f77; --line:#d6e0dc;
  --accent:#0f7b6c; --accent-ink:#ffffff; --user:#0f7b6c; --user-ink:#ffffff; --bot:#ffffff; --warn:#b4570a;
  --code:#0e1a20; --code-ink:#d8efe9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1519; --surface:#142127; --ink:#e4efec; --muted:#8ea3a9; --line:#26383f;
    --accent:#3fc2ac; --accent-ink:#06201b; --user:#1d6f62; --user-ink:#f1fffc; --bot:#142127; --warn:#f0a35a;
    --code:#08110f; --code-ink:#c9ece4; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:700 1.25rem/1 Georgia,"Times New Roman",serif;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font:400 .72rem/1.2 system-ui,sans-serif;color:var(--muted);letter-spacing:0;margin-top:3px}
select,button,textarea,input{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:150px}
.icon{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;cursor:pointer}
.icon:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:16px 14px;scroll-behavior:smooth}
.hello h1{font:700 1.6rem/1.2 Georgia,serif;margin:18px 0 6px}
.hello p{color:var(--muted);margin:0 0 16px;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.92rem}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.msg{display:flex;margin:10px 0}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--bot)}
.user .bubble{background:var(--user);color:var(--user-ink);border-color:transparent;border-bottom-right-radius:4px}
.bot .bubble{border-bottom-left-radius:4px}
.bubble.err{border-color:var(--warn);color:var(--warn)}
pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:pre;margin:8px 0 2px;font:.85rem/1.45 ui-monospace,Menlo,Consolas,monospace}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.6}main{scroll-behavior:auto}}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface);align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;height:42px;padding:0 16px;font-weight:600;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font:700 1.15rem Georgia,serif}
dialog p{color:var(--muted);font-size:.9rem;margin:6px 0 12px}
dialog label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
dialog input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.row button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.row .ok{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">AI FERIDE<small>Assistant intelligent et universel</small></div>
    <select id="model" aria-label="Modèle">
      <option value="auto">Feride Auto</option>
      <option value="gemini">Google Gemini</option>
      <option value="openai">OpenAI</option>
      <option value="claude">Claude</option>
      <option value="mistral">Mistral</option>
      <option value="deepseek">DeepSeek</option>
      <option value="llama">Llama</option>
      <option value="qwen">Qwen</option>
      <option value="ollama">Ollama (local)</option>
    </select>
    <button class="icon" id="clear" title="Nouvelle conversation" aria-label="Nouvelle conversation">＋</button>
    <button class="icon" id="cfg" title="Réglages" aria-label="Réglages">⚙</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Posez votre question…" aria-label="Votre message"></textarea>
    <button class="send" id="send" type="submit">Envoyer</button>
  </form>
</div>

<dialog id="dlg">
  <h2>Réglages</h2>
  <p>Collez l’adresse de votre serveur AI FERIDE. Il doit accepter une requête POST avec <code>{model, messages}</code> et répondre <code>{reply}</code>. Sans adresse, l’application répond en mode démo.</p>
  <label for="url">Adresse du serveur</label>
  <input id="url" type="url" placeholder="https://mon-serveur.exemple/api/chat" autocomplete="off">
  <div class="row">
    <button type="button" id="cancel">Annuler</button>
    <button type="button" class="ok" id="save">Enregistrer</button>
  </div>
</dialog>

<script>
(function(){
  var chat=document.getElementById('chat'), input=document.getElementById('input'),
      form=document.getElementById('form'), send=document.getElementById('send'),
      model=document.getElementById('model'), dlg=document.getElementById('dlg'),
      urlInput=document.getElementById('url');
  var messages=[], busy=false;

  var DOMAINS=[
    ['Windows et Linux','Explique-moi comment réparer un Windows qui ne démarre plus.'],
    ['Programmation','Aide-moi à écrire une fonction en JavaScript qui trie une liste.'],
    ['Réseaux','Comment configurer un réseau local avec un routeur et un switch ?'],
    ['Cybersécurité','Quelles sont les bonnes pratiques pour sécuriser un PC ?'],
    ['Intelligence artificielle','Explique-moi simplement comment fonctionne un modèle de langage.'],
    ['Maintenance','Mon ordinateur est lent, comment faire un diagnostic ?'],
    ['Bases de données','Montre-moi un exemple de requête SQL avec une jointure.'],
    ['Électronique et robotique','Comment commander un moteur avec une carte Arduino ?']
  ];

  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;} }

  function load(){
    try{ messages=JSON.parse(store('feride_msgs')||'[]'); }catch(e){ messages=[]; }
    var m=store('feride_model'); if(m) model.value=m;
    render();
  }
  function save(){ store('feride_msgs',JSON.stringify(messages.slice(-60))); }

  function hello(){
    var d=document.createElement('div'); d.className='hello';
    d.innerHTML='<h1>Que puis-je faire pour vous ?</h1><p>Je vous accompagne en informatique et nouvelles technologies. Choisissez un domaine ou écrivez votre question.</p>';
    var c=document.createElement('div'); c.className='chips';
    DOMAINS.forEach(function(x){
      var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=x[0];
      b.onclick=function(){ input.value=x[1]; input.focus(); grow(); };
      c.appendChild(b);
    });
    d.appendChild(c); chat.appendChild(d);
  }

  function fill(el,text){
    var parts=String(text).split('```');
    parts.forEach(function(p,i){
      if(i%2===1){
        var pre=document.createElement('pre'); pre.textContent=p.replace(/^[a-z0-9+#-]*\n/i,'').replace(/\n$/,''); el.appendChild(pre);
      } else if(p){ el.appendChild(document.createTextNode(p.replace(/^\n+|\n+$/g,''))); }
    });
  }

  function add(role,text,cls){
    var w=document.createElement('div'); w.className='msg '+(role==='user'?'user':'bot');
    var b=document.createElement('div'); b.className='bubble'+(cls?' '+cls:'');
    fill(b,text); w.appendChild(b); chat.appendChild(w); chat.scrollTop=chat.scrollHeight; return w;
  }

  function render(){
    chat.innerHTML='';
    if(!messages.length){ hello(); return; }
    messages.forEach(function(m){ add(m.role,m.content); });
  }

  function typing(){
    var w=document.createElement('div'); w.className='msg bot';
    w.innerHTML='<div class="bubble"><span class="dots" aria-label="AI FERIDE écrit"><span></span><span></span><span></span></span></div>';
    chat.appendChild(w); chat.scrollTop=chat.scrollHeight; return w;
  }

  function demo(text){
    return new Promise(function(res){
      setTimeout(function(){
        res('Mode démo : je n’ai pas encore de serveur IA connecté.\n\nVous avez écrit : « '+text+' »\n\nPour obtenir de vraies réponses, ouvrez les réglages (⚙) et indiquez l’adresse de votre serveur.');
      },700);
    });
  }

  function ask(){
    var url=store('feride_url');
    if(!url) return demo(messages[messages.length-1].content);
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:model.value,messages:messages})})
      .then(function(r){ if(!r.ok) throw new Error('Le serveur a répondu avec le code '+r.status+'.'); return r.json(); })
      .then(function(d){ if(!d||!d.reply) throw new Error('Réponse invalide : le champ « reply » est absent.'); return d.reply; });
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var text=input.value.trim(); if(!text||busy) return;
    busy=true; send.disabled=true;
    if(!messages.length) chat.innerHTML='';
    messages.push({role:'user',content:text}); add('user',text);
    input.value=''; grow();
    var t=typing();
    ask().then(function(reply){
      t.remove(); messages.push({role:'assistant',content:reply}); add('assistant',reply); save();
    }).catch(function(err){
      t.remove(); add('assistant','Impossible d’obtenir une réponse. '+(err&&err.message?err.message:'Vérifiez l’adresse du serveur et votre connexion.'),'err');
      messages.pop(); save();
    }).then(function(){ busy=false; send.disabled=false; input.focus(); });
  });

  function grow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; }
  input.addEventListener('input',grow);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&window.matchMedia('(min-width:700px)').matches){ e.preventDefault(); form.requestSubmit(); }
  });

  model.addEventListener('change',function(){ store('feride_model',model.value); });
  document.getElementById('clear').onclick=function(){ messages=[]; save(); render(); };
  document.getElementById('cfg').onclick=function(){ urlInput.value=store('feride_url')||''; dlg.showModal(); };
  document.getElementById('cancel').onclick=function(){ dlg.close(); };
  document.getElementById('save').onclick=function(){ store('feride_url',urlInput.value.trim()); dlg.close(); };

  load();
})();
</script>
</body>
</html>
