<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FERIDE AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0f19;color:#e5e7eb;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #1f2937}
.logo{display:flex;align-items:center;gap:10px;font-weight:bold}
.logo span.f{width:32px;height:32px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;color:#fff}
#newChat{background:#1f2937;color:#e5e7eb;border:0;border-radius:18px;padding:8px 14px;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
#welcome{margin:auto;text-align:center}
#welcome .brain{font-size:72px}
#welcome h2{margin-top:10px;font-size:20px}
#welcome p{color:#94a3b8;margin-top:6px;font-size:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1f2937;border-bottom-left-radius:4px}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
#preview{display:none;padding:6px 14px;gap:8px;align-items:center;font-size:13px;color:#94a3b8}
#preview img{height:44px;border-radius:8px}
#preview button{background:none;border:0;color:#f87171;font-size:18px}
#bar{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1f2937;background:#0b0f19}
.round{width:42px;height:42px;border-radius:50%;border:0;background:#1f2937;color:#e5e7eb;font-size:22px;flex:none}
#box{flex:1;display:flex;align-items:center;background:#1f2937;border-radius:22px;padding:0 6px 0 14px}
#input{flex:1;background:none;border:0;outline:0;color:#e5e7eb;font-size:16px;padding:11px 0}
#mic,#send{background:none;border:0;color:#e5e7eb;font-size:20px;width:38px;height:38px}
#send{color:#60a5fa}
#voice{background:#2563eb;color:#fff}
#voice.on{background:#dc2626;animation:p 1.2s infinite}
#mic.on{color:#f87171}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="f">F</span>FERIDE AI</div>
  <button id="newChat">Nouvelle conversation</button>
</header>

<div id="chat">
  <div id="welcome">
    <div class="brain">🧠</div>
    <h2>Bonjour ! Je suis FERIDE AI.</h2>
    <p>Comment puis-je vous aider aujourd'hui ?</p>
  </div>
</div>

<div id="preview"><img id="prevImg" alt=""><span>Photo prête</span><button id="rmImg">✕</button></div>

<div id="bar">
  <button class="round" id="plus">+</button>
  <div id="box">
    <input id="input" placeholder="Message à FERIDE AI" autocomplete="off">
    <button id="mic" title="Dictée">🎤</button>
    <button id="send" title="Envoyer">➤</button>
  </div>
  <button class="round" id="voice" title="Conversation vocale">🎧</button>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const prevImg = document.getElementById("prevImg");
let history = [];
let pendingImage = null;
let busy = false;
let voiceMode = false;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function addMsg(text, who, imgSrc) {
  const w = document.getElementById("welcome");
  if (w) w.remove();
  const d = document.createElement("div");
  d.className = "msg " + who;
  if (imgSrc) { const i = document.createElement("img"); i.src = imgSrc; d.appendChild(i); }
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speak(text, onEnd) {
  if (!("speechSynthesis" in window)) { if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fr-FR";
  u.onend = () => onEnd && onEnd();
  u.onerror = () => onEnd && onEnd();
  speechSynthesis.speak(u);
}

async function sendMessage(text) {
  text = (text || "").trim();
  if ((!text && !pendingImage) || busy) return;
  busy = true;
  const imgForShow = pendingImage ? pendingImage.url : null;
  const images = pendingImage ? [{ mime: pendingImage.mime, data: pendingImage.data }] : [];
  addMsg(text || "(photo)", "user", imgForShow);
  history.push({ role: "user", content: text || "Décris cette image." });
  input.value = "";
  clearImage();
  const wait = addMsg("…", "bot");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, images })
    });
    const data = await r.json();
    const reply = data.reply || ("Erreur : " + (data.error || "réponse vide"));
    wait.textContent = reply;
    history.push({ role: "assistant", content: reply });
    busy = false;
    if (voiceMode) speak(reply, listenLoop);
  } catch (e) {
    wait.textContent = "Erreur réseau : " + e.message;
    busy = false;
    if (voiceMode) listenLoop();
  }
  chat.scrollTop = chat.scrollHeight;
}

/* Photos */
document.getElementById("plus").onclick = () => fileInput.click();
fileInput.onchange = () => {
  const f = fileInput.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    pendingImage = { url, mime: f.type || "image/jpeg", data: url.split(",")[1] };
    prevImg.src = url;
    preview.style.display = "flex";
  };
  reader.readAsDataURL(f);
  fileInput.value = "";
};
function clearImage() { pendingImage = null; preview.style.display = "none"; }
document.getElementById("rmImg").onclick = clearImage;

/* Envoi */
document.getElementById("send").onclick = () => sendMessage(input.value);
input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(input.value); });

/* Dictée (micro) */
let dictRec = null;
const micBtn = document.getElementById("mic");
micBtn.onclick = () => {
  if (!SR) return alert("La dictée n'est pas supportée par ce navigateur.");
  if (dictRec) { dictRec.stop(); return; }
  dictRec = new SR();
  dictRec.lang = "fr-FR";
  dictRec.interimResults = true;
  micBtn.classList.add("on");
  dictRec.onresult = e => {
    let t = "";
    for (const r of e.results) t += r[0].transcript;
    input.value = t;
  };
  dictRec.onend = () => { micBtn.classList.remove("on"); dictRec = null; };
  dictRec.onerror = () => { micBtn.classList.remove("on"); dictRec = null; };
  dictRec.start();
};

/* Conversation vocale continue */
const voiceBtn = document.getElementById("voice");
let voiceRec = null;
function listenLoop() {
  if (!voiceMode || busy) return;
  voiceRec = new SR();
  voiceRec.lang = "fr-FR";
  voiceRec.interimResults = false;
  let got = false;
  voiceRec.onresult = e => {
    got = true;
    sendMessage(e.results[0][0].transcript);
  };
  voiceRec.onend = () => { if (voiceMode && !got && !busy) listenLoop(); };
  voiceRec.onerror = () => { if (voiceMode && !busy) setTimeout(listenLoop, 600); };
  try { voiceRec.start(); } catch (e) {}
}
voiceBtn.onclick = () => {
  if (!SR) return alert("La conversation vocale n'est pas supportée par ce navigateur.");
  voiceMode = !voiceMode;
  voiceBtn.classList.toggle("on", voiceMode);
  if (voiceMode) listenLoop();
  else { if (voiceRec) voiceRec.abort(); speechSynthesis.cancel(); }
};

/* Nouvelle conversation */
document.getElementById("newChat").onclick = () => {
  history = [];
  clearImage();
  speechSynthesis.cancel();
  chat.innerHTML = '<div id="welcome"><div class="brain">🧠</div><h2>Bonjour ! Je suis FERIDE AI.</h2><p>Comment puis-je vous aider aujourd\'hui ?</p></div>';
};
</script>
</body>
</html>
